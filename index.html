<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Tribe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
        }
        .progress {
            width: 300px;
            height: 20px;
            background-color: #444;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="loading">
            Loading Game...
            <div class="progress">
                <div class="progress-bar" id="progress"></div>
            </div>
        </div>
    </div>
    <script>
        // Pygbag generated code will be injected here
        async function loadGame() {
            let loadingProgress = document.getElementById('progress');
            let response = await fetch('game.data');
            let total = response.headers.get('content-length');
            let reader = response.body.getReader();
            let received = 0;

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                received += value.length;
                loadingProgress.style.width = (received / total * 100) + '%';
            }
        }

        window.addEventListener('load', loadGame);
    </script>
</body>
</html>
