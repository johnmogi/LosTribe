<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost Tribe</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2b2b2b;
            color: white;
            font-family: Arial, sans-serif;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-align: center;
        }
        #canvas {
            margin-top: 20px;
            border: 2px solid #4CAF50;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <div id="loading">Loading Python...</div>
    <canvas id="canvas" class="hidden" width="800" height="600"></canvas>

    <script type="text/javascript">
        async function main() {
            let pyodide = await loadPyodide();
            await pyodide.loadPackage("pygame");
            
            const response = await fetch('main.py');
            const pythonCode = await response.text();
            
            document.getElementById('loading').textContent = 'Starting game...';
            
            try {
                // Initialize pygame display
                await pyodide.runPythonAsync(`
                    import pygame
                    import platform
                    pygame.init()
                    canvas = document.getElementById('canvas')
                    pygame.display.set_mode((800, 600), canvas=canvas)
                `);
                
                // Hide loading and show canvas
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('canvas').classList.remove('hidden');
                
                // Run the main game code
                await pyodide.runPythonAsync(pythonCode);
            } catch (error) {
                console.error('Error running Python code:', error);
                document.getElementById('loading').textContent = 'Error loading game: ' + error.message;
            }
        }
        main();
    </script>
</body>
</html>
